name: Nix Integrity Check & Archive

on:
  push:
    branches: ["main"]
    tags: ["*"] # Run on version tags (e.g., 1.0, v2.3)
  pull_request:
    branches: ["main"]

jobs:
  publish-compiled:
    needs: check-integrity
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: compiled-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@v27
      - name: Use the locked Nix toolchain
        run: |
          ZENPKGS_NIX=$(nix build --no-link --print-out-paths --inputs-from . 'nixpkgs#nix^out')
          printf '%s/bin\n' "$ZENPKGS_NIX" >> "$GITHUB_PATH"
      - name: Validate and export compiled sources
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          bundle=$(nix build --no-link --print-out-paths .#dsl-bundle)
          nix build --no-link .#checks.x86_64-linux.compact-registry
          git worktree add --detach "$RUNNER_TEMP/compiled" "$SOURCE_REVISION"
          python3 scripts/export-compiled.py "$bundle" "$RUNNER_TEMP/compiled" "$SOURCE_REVISION"
          git -C "$RUNNER_TEMP/compiled" config user.name 'ZenOS Compiler Bot'
          git -C "$RUNNER_TEMP/compiled" config user.email 'bot@zenos.dev'
          git -C "$RUNNER_TEMP/compiled" add -f .compiled .zenpkgs-revision
          git -C "$RUNNER_TEMP/compiled" commit -m "Compile ZenPkgs $SOURCE_REVISION"
          previous=$(git ls-remote origin refs/heads/compiled-unstable | cut -f1)
          git -C "$RUNNER_TEMP/compiled" push \
            "--force-with-lease=refs/heads/compiled-unstable:$previous" \
            origin HEAD:refs/heads/compiled-unstable
  check-integrity:
    runs-on: ubuntu-latest
    concurrency:
      group: core-integrity-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write # Required to push to the json branch
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so we can switch branches easily

      - name: Reject local source inputs
        run: python3 tests/check-source-inputs.py

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # The generated modules and upstream libraries target the Nix version
      # shipped by our locked package set, not the action's bootstrap Nix.
      - name: Use the locked Nix toolchain
        run: |
          ZENPKGS_NIX=$(nix build --no-link --print-out-paths --inputs-from . 'nixpkgs#nix^out')
          printf '%s/bin\n' "$ZENPKGS_NIX" >> "$GITHUB_PATH"

      - name: Eval Report and Verify Status
        id: eval
        run: |
          echo "Running Integrity Check..."
          OUTPUT=$(nix eval --show-trace --option log-lines 300 --file tests/integrity.nix report 2>&1)

          echo "Nix Evaluation Output:"
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -Fq 'status = "PASSED";'; then
            echo "✅ Integrity check PASSED."
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Integrity check FAILED."
            echo "status=failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Verify package identities and category aliases
        shell: bash
        run: |
          failed=()
          checks=(steam-gamescope mutter-touch forge-recorder-vm dash-stacks-vm gnome-workspace-indicator-vm gnome-cursor blankbox-package blankbox-module application-program-options registry-contract registry-counts package-paths registry-build-providers
            registry-output-ownership registry-nzportable-identity registry-path-identities
            registry-invalid-identities registry-structure-exposure
            registry-metadata-defaults public-package-outputs
            package-output-collisions migration-packages migration-options search-index nzportable)
          for check in "${checks[@]}"; do
            echo "Checking $check"
            if nix build --no-link --print-build-logs --show-trace \
              ".#checks.x86_64-linux.$check" \
              --option max-jobs 1 --option cores 2 --option max-substitution-jobs 2 \
              > "$RUNNER_TEMP/$check.log" 2>&1; then
              echo "$check passed"
            else
              failed+=("$check")
              tail -n 120 "$RUNNER_TEMP/$check.log"
            fi
          done
          if (( ${#failed[@]} )); then
            printf 'Failed check: %s\n' "${failed[@]}"
            exit 1
          fi

      - name: Verify unquoted package selectors
        run: |
          nix build --dry-run --no-link --quiet .#com.neg-zero.zenos-setup
          nix build --dry-run --no-link --quiet .#apps.system.zenos-setup
          nix build --dry-run --no-link --quiet .#unknown.libsm
          nix build --dry-run --no-link --quiet .#libs.libsm

      - name: Verify declarative Gnosis web apps
        run: python3 tests/check-gnosis-web-apps.py

      - name: Verify search metadata enrichment
        run: python3 tests/search/test-enrichment.py

  publish-search:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: search-index-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            allow-import-from-derivation = true
      - name: Use the locked Nix toolchain
        run: |
          ZENPKGS_NIX=$(nix build --no-link --print-out-paths --inputs-from . 'nixpkgs#nix^out')
          printf '%s/bin\n' "$ZENPKGS_NIX" >> "$GITHUB_PATH"
      - name: Verify search export
        run: |
          python3 tests/search/test-enrichment.py
          nix build --no-link .#checks.x86_64-linux.search-index
      - name: Prepare search metadata reader
        run: |
          git init "$RUNNER_TEMP/search-reader"
          git -C "$RUNNER_TEMP/search-reader" fetch --depth=1 https://github.com/NixOS/nixos-search.git 2167f7df098eb0c10c82dbe71eeb52f8d8d1b393
          git -C "$RUNNER_TEMP/search-reader" checkout --detach FETCH_HEAD

      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/search-cache
            ${{ runner.temp }}/search-artwork
          key: search-artwork-v1-${{ github.sha }}
          restore-keys: search-artwork-v1-

      - name: Generate Documentation JSON
        run: |
          ZENPKGS_ARCHIVE_SOURCE_REVISION="$GITHUB_SHA" nix eval --json --impure --file scripts/gen-archive.nix > docs.json
          nix eval --json --impure --file scripts/search-package-manifest.nix > "$RUNNER_TEMP/search-manifest.json"
          if git fetch origin json; then
            git show FETCH_HEAD:latestCommit.json > "$RUNNER_TEMP/previous-search.json" || rm -f "$RUNNER_TEMP/previous-search.json"
          fi
          locked_nixpkgs=$(nix eval --raw --impure --expr '(builtins.getFlake (toString ./.)).inputs.nixpkgs.outPath')
          nix-shell -I "nixpkgs=$locked_nixpkgs" \
            -p 'python3.withPackages (ps: [ ps.requests ps.zstandard ps.brotli ])' imagemagick librsvg nix \
            --run "python3 scripts/search-popularity.py '$RUNNER_TEMP/search-manifest.json' --cache '$RUNNER_TEMP/search-cache' --output '$RUNNER_TEMP/search-popularity.json' && python3 scripts/enrich-search.py docs.json '$RUNNER_TEMP/search-manifest.json' --scanner '$RUNNER_TEMP/search-reader/flake-info/scripts/desktop-entries-index.py' --assets '$RUNNER_TEMP/search-artwork' --asset-url 'https://raw.githubusercontent.com/zenos-n/zenpkgs/json/artwork' --cache '$RUNNER_TEMP/search-cache' --previous '$RUNNER_TEMP/previous-search.json' --popularity '$RUNNER_TEMP/search-popularity.json'"
          python3 -c 'from pathlib import Path; size = Path("docs.json").stat().st_size; print(f"Archive JSON: {size / 1024**2:.1f} MiB"); assert size < 90 * 1024**2, "Archive exceeds the 90 MiB budget; do not push an oversized Git blob"'

      - name: Archive JSON to 'json' branch
        run: |
          git config --global user.name "ZenOS Bot"
          git config --global user.email "bot@zenos.dev"

          # Determine filenames based on ref type
          # Always update latestCommit.json for main branch pushes
          # For tags, create <tag>.json

          FILES_TO_ADD=""

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "Detected release tag: $TAG_NAME"
            cp docs.json "/tmp/$TAG_NAME.json"
            FILES_TO_ADD="$TAG_NAME.json"
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            echo "Detected push to main."
            cp docs.json /tmp/latestCommit.json
            FILES_TO_ADD="latestCommit.json"
          fi

          # Switch to 'json' branch
          if git ls-remote --exit-code --heads origin json; then
            git fetch origin json
            git checkout json
          else
            git checkout --orphan json
            git rm -rf .
          fi

          # Move files into place
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            mv "/tmp/$TAG_NAME.json" .
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            mv /tmp/latestCommit.json .
          fi

          # Add and Commit
          mkdir -p artwork
          cp -a "$RUNNER_TEMP/search-artwork/." artwork/
          git add artwork
          git add "$FILES_TO_ADD"

          if ! git diff --cached --quiet; then
            git commit -m "Archive: ${GITHUB_REF_NAME} - $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push origin json
          else
            echo "No changes to commit."
          fi
