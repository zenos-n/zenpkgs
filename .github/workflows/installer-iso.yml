name: Build installer ISO

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-iso
  cancel-in-progress: false

jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout package toolchain
        uses: actions/checkout@v4
        with:
          path: zenpkgs

      - name: Checkout installer composition
        uses: actions/checkout@v4
        with:
          repository: zenos-n/zenos-config
          ref: main
          path: zenos

      # These are preinstalled SDKs on the disposable GitHub runner, not files
      # on a developer machine. Reserve the runner's disk for the Nix closure.
      - name: Reserve runner disk for the image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install bootstrap Nix
        uses: cachix/install-nix-action@v27

      - name: Use the locked Nix toolchain
        working-directory: zenpkgs
        run: |
          ZENPKGS_NIX=$(nix build --no-link --print-out-paths --inputs-from . 'nixpkgs#nix^out')
          printf '%s/bin\n' "$ZENPKGS_NIX" >> "$GITHUB_PATH"

      - name: Build the general installer
        run: |
          nix build ./zenos#iso --out-link installer-result \
            --override-input zenpkgs "path:$GITHUB_WORKSPACE/zenpkgs" \
            --no-write-lock-file \
            --option max-jobs 1 --option cores 2 --option max-substitution-jobs 2 \
            --print-build-logs
          mkdir -p artifacts
          cp -L installer-result/iso/*.iso artifacts/
          (cd artifacts && sha256sum *.iso > SHA256SUMS)
          git -C zenos rev-parse HEAD > artifacts/zenos-revision.txt
          git -C zenpkgs rev-parse HEAD > artifacts/toolchain-revision.txt
          cp zenos/flake.lock artifacts/installer-flake.lock
          nix flake metadata ./zenos --json \
            --override-input zenpkgs "path:$GITHUB_WORKSPACE/zenpkgs" \
            --no-write-lock-file > artifacts/effective-inputs.json

      - name: Upload installer and checksums
        uses: actions/upload-artifact@v4
        with:
          name: zenos-next-installer
          path: artifacts/
          compression-level: 0
          retention-days: 14

      - name: Verify Codex daemon in a ZenOS VM
        run: |
          nix build ./zenpkgs#checks.x86_64-linux.codex-cli-vm --no-link \
            --option max-jobs 1 --option cores 2 --option max-substitution-jobs 2 \
            --print-build-logs
